name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema ../pinesaas-blogs/prisma/schema.prisma

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests when available
        working-directory: backend
        run: npm test --if-present

      - name: Install frontend dependencies
        working-directory: pinesaas-blogs
        run: npm ci

      - name: Build frontend
        working-directory: pinesaas-blogs
        run: npm run build

      - name: Run frontend lint
        working-directory: pinesaas-blogs
        run: npm run lint

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 10028
          script: |
            echo "===== ITMS DEPLOYMENT ====="
            echo "USER=$(whoami)"
            echo "HOME=$HOME"

            cd /home/administrator/projects/pinesaas-crm

            ./scripts/deploy.sh

            echo "===== ITMS DEPLOYMENT FINISHED ====="
